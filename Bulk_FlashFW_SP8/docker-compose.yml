services:
  flashtools-web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist recipe.yaml / downloaded firmware / fleet logs across container restarts.
      - ./flashtools/recipe.yaml:/srv/flashtools/recipe.yaml
      - ./flashtools/bin:/srv/flashtools/bin
      - ./flashtools/fleet_logs:/srv/flashtools/fleet_logs
      # Shared service-account tokens for refresh jobs (atlassian CLI / Microsoft Graph) -
      # see README.md's "Service-account setup for firmware refresh" section.
      - flashtools-config:/root/.config

volumes:
  flashtools-config:
